name: CI

on:
  push:
    branches:
      - main
      - "ci/**"
  pull_request:

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    env:
      PYTHONPYCACHEPREFIX: /tmp/matrix-calculator-pycache
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install system validators
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils libegl1 libgl1 libxkbcommon-x11-0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run UI smoke test
        run: python tools/ui_smoke.py

      - name: Validate desktop files
        run: |
          desktop-file-validate MatrixCalculator.desktop
          desktop-file-validate io.github.MrMiYaGi68.MatrixCalculator.desktop

      - name: Build package
        run: |
          python -m pip install build
          python -m build

      - name: Check for generated pycache in repository
        run: test -z "$(find . -name __pycache__ -print -quit)"
